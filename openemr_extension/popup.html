<!DOCTYPE html>
<html>
<head>
  <title>OpenEMR Code Extractor</title>
  <style>
    body {
      width: 320px;
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      padding: 20px;
    }
    h3 {
      margin: 0 0 15px 0;
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    button {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s;
      margin-bottom: 15px;
    }
    button:hover {
      background: #218838;
      transform: translateY(-1px);
    }
    #results {
      max-height: 300px;
      overflow-y: auto;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 15px;
      backdrop-filter: blur(10px);
    }
    .code-section h4 {
      margin: 0 0 10px 0;
      color: #ffd700;
      font-size: 16px;
    }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    li {
      background: rgba(255,255,255,0.1);
      margin-bottom: 5px;
      padding: 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      border-left: 3px solid #28a745;
    }
    .no-results {
      text-align: center;
      padding: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>🩺 Medical Code Extractor</h3>
    <button id="extract">Extract Codes from Page</button>
    <button id="clear" style="margin-left: 10px; background: #dc3545;">Clear Results</button>
    <div id="stats" style="font-size: 12px; color: #fff; margin: 10px 0;">Ready for extraction.</div>
    <div id="results"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
